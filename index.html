<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Asteroids</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" loop>
    <source src="./assets/Soundtrack.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<div id="ui">
    Очки: <span id="score">0</span>
</div>

<!-- Кнопка-медаль в углу -->
<button id="medalButton" class="medal-button" onclick="showResults()">
    <span class="medal-icon">🏆</span>
</button>

<!-- Модальное окно с результатами -->
<div id="resultsModal" class="modal">
    <div class="modal-content">
        <div class="modal-body">
            <div class="result-item">
                <span class="result-label">Максимальный счет</span>
                <span class="result-value" id="highScore">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">Всего игр</span>
                <span class="result-value" id="totalGames">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">Всего очков</span>
                <span class="result-value" id="totalScore">0</span>
            </div>
            <div class="result-divider"></div>
        </div>
        <div class="modal-footer">
            <button class="modal-button" onclick="closeResults()">Закрыть</button>
            <button class="modal-button reset-button" onclick="resetStats()">Сбросить</button>
        </div>
    </div>
</div>

<div id="startScreen">



    <h2>Управляй кораблем и уклоняйся от астероидов!</h2>
    <p>Набери 50 очков и получи награду для кросстендовского конкурса</p>
    <button id="startButton">Начать игру</button>
</div>

<div id="gameOver">
    <h1 id="gameOverTitle">💥 Столкновение!</h1>
    <p id="finalScore"></p>
    <button id="restartButton" >Играть снова</button>
</div>

<canvas id="game"></canvas>

<script type="module" src="js/main.js"></script>

</body>
</html>
